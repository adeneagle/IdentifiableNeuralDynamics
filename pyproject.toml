[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idyn"
version = "0.1.0"
description = "Identifiability of modular nonlinear latent dynamics"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "torch>=2.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
